# Apache como proxy reverso na porta 80 para o gunicorn local.
<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    ErrorLog  /var/log/httpd/labirinto_error.log
    CustomLog /var/log/httpd/labirinto_access.log combined
</VirtualHost>
