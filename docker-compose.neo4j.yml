# [IA] Claude – Neo4j local (Community, sem plugins) só para visualizar/explorar o grafo de rotação da Parte 2
# Uso: docker compose -f docker-compose.neo4j.yml up -d   ->  http://localhost:7474  (bolt://localhost:7687)
# A senha padrão (neo4j/grafos2026) é só para uso LOCAL; troque com NEO4J_AUTH=neo4j/<outra> no ambiente.
services:
  neo4j:
    image: neo4j:5-community
    container_name: grafos-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/grafos2026}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
    restart: unless-stopped
