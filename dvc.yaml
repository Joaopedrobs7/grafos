stages:
  baixar:
    cmd: python -m src.parte2.baixar
    deps:
    - src/parte2/baixar.py
    outs:
    - data/dataset_parte2/raw
  preparar:
    cmd: python -m src.parte2.preparar
    deps:
    - data/dataset_parte2/raw
    - src/parte2/preparar.py
    params:
    - preparar
    outs:
    - data/dataset_parte2/processed
  rotacao:
    cmd: python -m src.parte2.rotacao
    deps:
    - data/dataset_parte2/raw
    - src/parte2/preparar.py
    - src/parte2/rotacao.py
    params:
    - rotacao
    outs:
    - data/dataset_parte2/rotacao
