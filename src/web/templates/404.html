<script>
(function () {
  "use strict";
  var doc = document;
  doc.documentElement.classList.remove("sem-js");

  /* ------------------------------------------------------------ 1. caminho pedido (só como texto) */
  (function () {
    var el = doc.getElementById("caminho"), texto = location.pathname || "/";
    try { texto = decodeURIComponent(texto); } catch (e) { /* URL malformada: mostra como veio */ }
    // caminhos longos: reticências no meio, preservando o começo e o fim (o completo fica no title)
    if (texto.length > 40) { el.title = texto; texto = texto.slice(0, 22) + "…" + texto.slice(-17); }
    el.textContent = texto;
  })();

  /* ------------------------------------------------------------ 2. paleta e utilitários de pixel */
  var PX = (window.LAB && window.LAB.pixel) || null;       // pixel.js do site, quando carregou
  var PAL = (PX && PX.PALETTE) || {}, TIL = PAL.tiles || {};
  function hex(v, padrao) { return typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v) ? v : padrao; }
  var COR = {
    noite: hex(PAL.noite, "#1A1612"), noite2: hex(PAL.noite2, "#26201A"),
    luar: hex(PAL.luar, "#EFE6D8"), luarFraco: hex(PAL.luarFraco, "#B5A895"),
    cesar: hex(PAL.cesar, "#FF6002"), ok: hex(PAL.ok, "#3FCF8E"),
    chao: hex(TIL.chao, "#4A423A"), chaoAlt: hex(TIL.chaoAlt, "#443C35"),
    parede: hex(TIL.parede, "#3C342D"), paredeTopo: hex(TIL.paredeTopo, "#7A6C5E")
  };
  // mistura com branco (f > 0) ou preto (f < 0): sombras e luzes saem da mesma cor base
  function tom(h, f) {
    var n = parseInt(h.slice(1), 16), alvo = f < 0 ? 0 : 255, k = Math.abs(f), s = "#";
    [n >> 16, n >> 8 & 255, n & 255].forEach(function (v) {
      s += ("0" + Math.round(v + (alvo - v) * k).toString(16)).slice(-2);
    });
    return s;
  }
  function tela(w, h, pintar) {
    var c = doc.createElement("canvas"); c.width = w; c.height = h;
    var x = c.getContext("2d"); x.imageSmoothingEnabled = false; pintar(x, w, h);
    return c;
  }
  function sorteio(semente) {                          // gerador determinístico (texturas estáveis)
    return function () { semente = (semente * 1664525 + 1013904223) >>> 0; return semente / 4294967296; };
  }
  function pintarMatriz(x, linhas, cores, ox, oy) {
    for (var r = 0; r < linhas.length; r++) for (var c = 0; c < linhas[r].length; c++) {
      var ch = linhas[r][c];
      if (ch !== "." && cores[ch]) { x.fillStyle = cores[ch]; x.fillRect(ox + c, oy + r, 1, 1); }
    }
  }

  /* ------------------------------------------------------------ 3. o aluno (sprite do site ou reserva) */
  // Reserva 16×24 usada só se /static/js/pixel.js não carregar: cabelo cacheado, óculos redondos,
  // moletom grafite com a marca da CESAR, fones no pescoço, mochila, jeans e tênis brancos.
  var RESERVA = {
    front: ["....kk.kk.kk....", "...khHkhhkhhk...", "..khHhhhhHHhhk..", ".khHhhHhhhhhhhk.", ".khhhhhhHhhHhhk.",
            ".khhhshsshshhhk.", ".khsggssssggshk.", ".khgLLggggLLghk.", ".khsggssssggshk.", ".khSssssssssShk.",
            "..kSssssssssSk..", "...kSSssssSSk...", "...kpPSSSSPpk...", ".kCCdccccccdCCk.", ".kCCccOwwOccCCk.",
            ".kCCcOOOOOOcCCk.", ".kCCccOOOOccCCk.", ".kCCccccccccCCk.", ".kssCCCCCCCCssk.", "...kjjjjjjjjk...",
            "...kjjJkkJjjk...", "...kjjJkkJjjk...", "...knnnkknnnk...", "...kNNNkkNNNk..."],
    back:  ["....kk.kk.kk....", "...khHkhhkhhk...", "..khHhhhhHHhhk..", ".khHhhHhhhhhhhk.", ".khhhhHhHhhHhhk.",
            ".khhhhhhhhhhhhk.", ".khhhhhhhhHhhhk.", ".khhHhhhhhhhhhk.", ".khhhhhhhhhhhhk.", ".khhhhhhhhhhhhk.",
            "..khhhhhhhhhhk..", "...khhSSSShhk...", "...kpPSSSSPpk...", ".kCCdkkkkkkdCCk.", ".kCCkbbbbbbkCCk.",
            ".kCCkbBBBBbkCCk.", ".kCCkbbbbbbkCCk.", ".kCCkbbbbbbkCCk.", ".kssCkkkkkkCssk.", "...kjjjjjjjjk...",
            "...kjjJkkJjjk...", "...kjjJkkJjjk...", "...knnnkknnnk...", "...kNNNkkNNNk..."],
    side:  ["....kk.kk.......", "...khhkhhkk.....", "..khhhhhHhhk....", "..khhHhhhhhhk...", ".khhhhhhhhhhk...",
            ".khhhhhhhhshk...", ".khhhhhssgggsk..", ".khhhhSSgLLgsk..", ".khhhhSssgggssk.", "..khhhhssssssk..",
            "..khhhsssssmk...", "...khSSssssk....", "....kpPSSk......", "...kbbCCdcck....", "...kbbCCcccck...",
            "...kbBCCccOOk...", "...kbbCCccOOk...", "...kbbCCcccck...", "....kkCsCCCk....", ".....kjjjjk.....",
            ".....kjjJjk.....", ".....kjjJjk.....", ".....knnnnnk....", ".....kNNNNNk...."],
    passoLado: {
      1: [".....kjjjjk.....", "....kjjkJjk.....", "...kjjk.kJjk....", "..knnnk.knnnnk..", "..kNNNk.kNNNNk.."],
      3: [".....kjjjjk.....", ".....kjJkjjk....", "....kJjk.kjjk...", "...knnnnkknnnk..", "...kNNNNkkNNNk.."]
    },
    cores: { k: "#15121F", h: "#2B1D18", H: "#4E372D", s: "#9A6440", S: "#76482C", g: "#15121F", L: "#CFE0F5",
             m: "#6B3524", c: "#2A2838", C: "#1E1C2A", d: "#3B3850", O: "#FF6002", w: "#FFFFFF", p: "#9A97B5",
             P: "#55526E", j: "#3D5A99", J: "#2C4277", n: "#F1F0F7", N: "#B7B4CC", b: "#6B4433", B: "#8A5B45" }
  };
  function spriteReserva(vista, quadro) {
    var linhas = RESERVA[vista].slice();
    if (quadro === 1 || quadro === 3) {
      if (vista === "side") linhas = linhas.slice(0, 19).concat(RESERVA.passoLado[quadro]);
      else {                                            // frente/costas: uma perna sobe 1 px
        var c0 = quadro === 1 ? 3 : 8, base = linhas.slice();
        for (var r = 20; r < 24; r++) {
          var de = r < 23 ? base[r + 1] : "................";
          linhas[r] = base[r].slice(0, c0) + de.slice(c0, c0 + 5) + base[r].slice(c0 + 5);
        }
      }
    }
    return tela(16, 24, function (x) { pintarMatriz(x, linhas, RESERVA.cores, 0, 0); });
  }
  var spritesCache = {};
  function sprite(vista, quadro) {
    var chave = vista + quadro;
    if (spritesCache[chave]) return spritesCache[chave];
    var img = null;
    if (PX && typeof PX.studentSprite === "function") {
      try { img = PX.studentSprite(vista, quadro, 1); } catch (e) { img = null; }
      if ((!img || !img.width) && quadro === "idle") {
        try { img = PX.studentSprite(vista, 0, 1); } catch (e) { img = null; }
      }
    }
    if (!img || !img.width) img = spriteReserva(vista, quadro === "idle" ? 0 : quadro);
    return (spritesCache[chave] = img);
  }
  // O perfil do sprite olha para o leste (L); para oeste (O) ele é espelhado.
  var VISTA = { N: "back", S: "front", L: "side", O: "side" };

  /* ------------------------------------------------------------ 4. o labirinto "404" */
  var T = 16, ALT = 12, TOPO = 30, BASE = 8;   // casa, altura da face da parede, folga no alto, espessura da ilha
  var DIGITOS = {
    "4": ["#...#", "#...#", "#...#", "#####", "....#", "....#", "....#"],
    "0": [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."]
  };
  var DIRS = [{ m: "N", dr: -1, dc: 0 }, { m: "L", dr: 0, dc: 1 }, { m: "S", dr: 1, dc: 0 }, { m: "O", dr: 0, dc: -1 }];

  function montarLabirinto(margem, vao) {
    var cols = margem * 2 + 15 + vao * 2, rows = margem * 2 + 7, g = [], r, c;
    for (r = 0; r < rows; r++) { g.push([]); for (c = 0; c < cols; c++) g[r].push("."); }
    var origens = [margem, margem + 5 + vao, margem + 10 + vao * 2];
    "404".split("").forEach(function (d, i) {
      DIGITOS[d].forEach(function (linha, dr) {
        for (var dc = 0; dc < 5; dc++) if (linha[dc] === "#") g[margem + dr][origens[i] + dc] = "#";
      });
    });
    for (r = 1; r <= 5; r++) for (c = 1; c <= 3; c++) g[margem + r][origens[1] + c] = "i"; // miolo do zero
    var saida = { r: margem + 3, c: origens[1] + 2 }, inicio = { r: margem + 3, c: 0 };
    g[saida.r][saida.c] = "G";
    g[inicio.r][inicio.c] = "S";
    g[0][0] = g[0][cols - 1] = g[rows - 1][0] = g[rows - 1][cols - 1] = "x";             // cantos da ilha
    var meio0 = origens[1] + 2;
    return {
      cols: cols, rows: rows, g: g, saida: saida, inicio: inicio,
      // ronda automática: os dois becos sem saída (o vão de cada 4) e os dois lados do zero
      roteiro: [
        { r: margem + 1, c: origens[0] + 2, olhar: "S" },
        { r: margem + 7, c: meio0, olhar: "N" },
        { r: margem + 1, c: origens[2] + 2, olhar: "S" },
        { r: margem - 1, c: meio0, olhar: "S" }
      ]
    };
  }
  var LAB404 = null;
  function celula(r, c) { return r < 0 || c < 0 || r >= LAB404.rows || c >= LAB404.cols ? "x" : LAB404.g[r][c]; }
  function andavel(r, c) { var ch = celula(r, c); return ch !== "#" && ch !== "x"; }

  // Passeio guloso (só enfeite da página, não é algoritmo do projeto): a cada passo o aluno vai para a casa
  // vizinha ainda não pisada que fica mais perto do destino (distância de Manhattan). Sem fila, sem pilha:
  // se ele se encurrala, para na casa mais próxima do destino a que chegou e fica em dúvida.
  function manhattan(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c); }
  function passeio(de, alvo) {
    var pisadas = {}, u = { r: de.r, c: de.c }, rota = [], melhor = 0, dMelhor = manhattan(u, alvo);
    var limite = 4 * dMelhor + 12;
    pisadas[u.r + "," + u.c] = true;
    for (var n = 0; n < limite && (u.r !== alvo.r || u.c !== alvo.c); n++) {
      var prox = null, dProx = Infinity;
      for (var k = 0; k < 4; k++) {
        var v = { r: u.r + DIRS[k].dr, c: u.c + DIRS[k].dc };
        if (!andavel(v.r, v.c) || pisadas[v.r + "," + v.c]) continue;
        var dv = manhattan(v, alvo);
        if (dv < dProx) { prox = v; dProx = dv; }
      }
      if (!prox) break;
      pisadas[prox.r + "," + prox.c] = true;
      rota.push(prox); u = prox;
      if (dProx < dMelhor) { dMelhor = dProx; melhor = rota.length; }
    }
    rota = rota.slice(0, melhor);                       // corta a volta inútil depois do ponto mais próximo
    return { rota: rota, chegou: dMelhor === 0 };
  }

  /* ------------------------------------------------------------ 5. texturas (procedurais, sem imagens) */
  var texturas = {};
  function texChao(v) {
    var chave = "chao" + v;
    if (texturas[chave]) return texturas[chave];
    if (PX && typeof PX.tileTexture === "function") {
      try { var t = PX.tileTexture(".", v); if (t && t.width) return (texturas[chave] = t); } catch (e) { /* reserva */ }
    }
    return (texturas[chave] = tela(T, T, function (x) {
      var rnd = sorteio(v * 7919 + 17), base = v % 2 ? COR.chaoAlt : COR.chao;
      x.fillStyle = base; x.fillRect(0, 0, T, T);
      x.fillStyle = tom(base, 0.07); x.fillRect(0, 0, T - 1, 1); x.fillRect(0, 0, 1, T - 1);
      x.fillStyle = tom(base, -0.28); x.fillRect(0, T - 1, T, 1); x.fillRect(T - 1, 0, 1, T);
      for (var i = 0; i < 5; i++) {
        x.fillStyle = tom(base, rnd() < 0.5 ? 0.09 : -0.14);
        x.fillRect(2 + (rnd() * 11 | 0), 2 + (rnd() * 11 | 0), 1, 1);
      }
      if (v === 3) { x.fillStyle = tom(base, -0.22); x.fillRect(4, 9, 3, 1); x.fillRect(7, 8, 2, 1); x.fillRect(9, 7, 1, 1); }
    }));
  }
  function texPad(tipo) {
    var chave = "pad" + tipo;
    if (texturas[chave]) return texturas[chave];

      try { var t = PX.tileTexture(tipo, 0); if (t && t.width) return (texturas[chave] = t); } catch (e) { /* reserva */ }
    }
    return (texturas[chave] = tela(T, T, function (x) {
      x.drawImage(texChao(0), 0, 0);
      var cor = tipo === "S" ? COR.cesar : COR.ok;
      for (var y = 0; y < T; y++) for (var c = 0; c < T; c++) {
        var dx = (c - 7.5) / 7, dy = (y - 7.5) / 6, d = Math.sqrt(dx * dx + dy * dy);
        // anéis concêntricos (o motivo da marca da CESAR no início; um portal na saída)
        var anel = d <= 1 && (d > 0.78 || (d > 0.42 && d <= 0.6) || d <= 0.2);
        if (anel) { x.fillStyle = d > 0.78 ? tom(cor, -0.25) : cor; x.fillRect(c, y, 1, 1); }
      }
    }));
  }
  function texTijolos(v) {
    if (!PX || typeof PX.wallTexture !== "function") return null;
    try { var t = PX.wallTexture("side", v); return t && t.width ? t : null; } catch (e) { return null; }

    irPara(alvo, {});
  });

  var TECLAS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
  doc.addEventListener("keydown", function (ev) {
    if (!(ev.key in TECLAS) || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    // as setas só viram controle com o labirinto em foco ou quando a página nem tem rolagem
    var rola = doc.documentElement.scrollHeight > window.innerHeight + 1;
    if (doc.activeElement !== canvas && (rola || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName || ""))) return;
    ev.preventDefault();
    assumirControle();
    var d = DIRS[TECLAS[ev.key]], base = casaBase(), v = { r: base.r + d.dr, c: base.c + d.dc };
    if (!andavel(v.r, v.c)) {                          // esbarrou: vira para a parede e fica em dúvida
      if (!aluno.rota.length) { aluno.rumo = d.m; aluno.balao = { t0: agora, ate: reduzido ? Infinity : agora + 1.2 }; }
      if (reduzido) desenhar();
      return;
    }
    if (reduzido) { aluno.r = v.r; aluno.c = v.c; aluno.rumo = d.m; aluno.balao = null; atualizarRotulo(); desenhar(); return; }
    aluno.balao = null; aluno.aoChegar = null;
    aluno.rota = aluno.rota.slice(0, 1).concat([v]);
    if (aluno.rota.length === 1) { aluno.rumo = d.m; aluno.prog = 0; }
  });

  if (matchMedia("(pointer: coarse)").matches) {
    doc.getElementById("dica").textContent = "Toque no chão para mover o aluno.";
  }

  /* ------------------------------------------------------------ 11. laço */
  var ultimo = 0, raf = 0;
  function quadroAnimacao(ms) {
    var t = ms / 1000, dt = Math.min(0.05, ultimo ? t - ultimo : 0);
    ultimo = t; agora = t;
    atualizar(dt);
    desenhar();
    if (agora - ultimoCeu > 0.25) { ultimoCeu = agora; pintarCeu(); }
    raf = requestAnimationFrame(quadroAnimacao);
  }
  function iniciar() {
    cancelAnimationFrame(raf); ultimo = 0;
    agora = performance.now() / 1000;
    layout = ""; medir(); montarCeu(); pintarMarca();
    if (reduzido) desenhar();
    else raf = requestAnimationFrame(quadroAnimacao);
  }

  var redimensionar = 0;
  window.addEventListener("resize", function () {
    cancelAnimationFrame(redimensionar);
    redimensionar = requestAnimationFrame(function () { medir(); montarCeu(); if (reduzido) desenhar(); });
  });
  var aoMudarMovimento = function () { reduzido = mqReduzido.matches; iniciar(); };
  if (mqReduzido.addEventListener) mqReduzido.addEventListener("change", aoMudarMovimento);
  else if (mqReduzido.addListener) mqReduzido.addListener(aoMudarMovimento);

  // a fonte pixel muda a altura do texto; reavalia a escala quando ela chegar
  if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { medir(); if (reduzido) desenhar(); });
  iniciar();
})();
</script>
</body>
</html>
