<!doctype html>
<!-- [IA] Claude – interface do labirinto interativo (HTML/CSS/JS de visualização) -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labirinto com Chaves</title>
<style>
  :root {
    --bg: #f5f3ef; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2dfd8;
    --accent: #e8590c; --ok: #2b8a3e; --warn: #c92a2a; --trap: rgba(201, 42, 42, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1f1f23; --ink: #f1f1f3; --muted: #9a9aa2; --line: #2e2e34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .badge { font: 12px ui-monospace, Menlo, monospace; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .badge b { color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  select, button, input[type=range] { font: inherit; }
  select, button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { cursor: pointer; min-width: 38px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .canvas-wrap { overflow: auto; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .side { display: grid; gap: 16px; align-content: start; }
  .status { font-weight: 600; }
  .status.OK { color: var(--ok); } .status.RECUSA, .status.SEM_SOLUCAO, .status.CICLO_NEGATIVO { color: var(--warn); }
  .msg { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid #0002; }
  .row { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Labirinto com Chaves <span>· grafo de estados</span></h1>
  <div class="badge" id="servidor">carregando…</div>
</header>
<main>
  <section class="card">
    <div class="controls">
      <label>Mapa <select id="selMapa"></select></label>
      <label>Algoritmo <select id="selAlg"></select></label>
      <label>Camada <select id="selCamada"></select></label>
      <label>Velocidade <input id="vel" type="range" min="1" max="20" value="4"></label>
      <div class="row">
        <button id="btnInicio" title="voltar ao início">|◀</button>
        <button id="btnVoltar" title="passo anterior">◀</button>
        <button id="btnPlay" class="primary" title="animar">▶</button>
        <button id="btnAvancar" title="próximo passo">▶|</button>
      </div>
      <label class="row"><input id="chkTrap" type="checkbox" checked> armadilhas</label>
    </div>
    <div class="canvas-wrap"><canvas id="cv"></canvas></div>
    <div class="legend" id="legenda"></div>
  </section>
  <aside class="side">
    <div class="card">
      <h2>Estado atual</h2>
      <dl>
        <dt>passo</dt><dd id="dPasso">–</dd>
        <dt>rótulo</dt><dd id="dRotulo">–</dd>
        <dt>posição</dt><dd id="dPos">–</dd>
        <dt>chaves</dt><dd id="dChaves">–</dd>
        <dt>bônus</dt><dd id="dBonus">–</dd>
        <dt>custo acum.</dt><dd id="dCusto">–</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Resultado</h2>
      <dl>
        <dt>status</dt><dd><span id="dStatus" class="status">–</span></dd>
        <dt>passos</dt><dd id="dPassos">–</dd>
        <dt>custo</dt><dd id="dCustoTot">–</dd>
        <dt>estados</dt><dd id="dEstados">–</dd>
        <dt>arcos</dt><dd id="dArcos">–</dd>
        <dt>teto</dt><dd id="dTeto">–</dd>
        <dt>armadilhas</dt><dd id="dTrap">–</dd>
      </dl>
      <div class="msg" id="dMsg"></div>
    </div>
  </aside>
</main>
<script>
/*__DADOS_EMBUTIDOS__*/
const CORES = { "#": "#3a3a3a", ".": "#ffffff", "S": "#7fc97f", "G": "#fdbf6f", ",": "#c8a26b", "~": "#7fb2d9",
  "+": "#a5e3a5", "*": "#ffd54f", "a": "#fff0a0", "b": "#fff0a0", "c": "#fff0a0", "d": "#fff0a0",
  "A": "#b39ddb", "B": "#b39ddb", "C": "#b39ddb", "D": "#b39ddb", ">": "#d9d9d9", "<": "#d9d9d9", "^": "#d9d9d9", "v": "#d9d9d9" };
const CORES_CAMADA = ["#d62728", "#1f77b4", "#2ca02c", "#9467bd", "#ff7f0e", "#17becf"];
const LEGENDA = [["#3a3a3a","parede"],["#ffffff","chão (1)"],["#c8a26b","lama (3)"],["#7fb2d9","água (5)"],
  ["#fff0a0","chave"],["#b39ddb","porta"],["#d9d9d9","esteira"],["#a5e3a5","bônus (−4)"],["#ffd54f","fonte (−2)"],
  ["#7fc97f","início"],["#fdbf6f","saída"],["rgba(201,42,42,.55)","estado-armadilha"]];
const $ = id => document.getElementById(id);
const EMBUTIDO = typeof window.__DADOS__ !== "undefined";
let mapa = null, perc = [], idx = 0, timer = null;

$("legenda").innerHTML = LEGENDA.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join("");

async function listarMapas() {
  if (EMBUTIDO) return Object.keys(window.__DADOS__);
  const r = await fetch("api/mapas"); return (await r.json()).mapas;
}
async function carregarMapa(nome) {
  if (EMBUTIDO) return window.__DADOS__[nome];
  const r = await fetch("api/mapa/" + encodeURIComponent(nome));
  const d = await r.json();
  mostrarServidor(d.servidor);
  return d;
}
function mostrarServidor(s) {
  if (!s) { $("servidor").innerHTML = "modo estático (arquivo HTML)"; return; }
  $("servidor").innerHTML = `servido por <b>${s.instancia}</b> · ${s.zona} · ${s.ip}`;
}

function cel() { return Math.max(8, Math.min(34, Math.floor(1100 / mapa.grade[0].length))); }

function desenhar() {
  const cv = $("cv"), ctx = cv.getContext("2d"), t = cel();
  const L = mapa.grade.length, C = mapa.grade[0].length;
  cv.width = C * t; cv.height = L * t;
  const camada = $("selCamada").value;
  const naCamada = new Set((mapa.camadas[camada] || []).map(([r, c]) => r + "," + c));
  for (let r = 0; r < L; r++) for (let c = 0; c < C; c++) {
    const ch = mapa.grade[r][c];
    ctx.fillStyle = CORES[ch] || "#fff"; ctx.fillRect(c * t, r * t, t, t);
    if (camada !== "todas" && ch !== "#" && !naCamada.has(r + "," + c)) { ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(c * t, r * t, t, t); }
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.strokeRect(c * t, r * t, t, t);
    if (t >= 14 && !"#.".includes(ch)) { ctx.fillStyle = "#222"; ctx.font = `bold ${Math.floor(t * .5)}px monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, c * t + t / 2, r * t + t / 2); }
  }
  if ($("chkTrap").checked) {
    ctx.fillStyle = "rgba(201,42,42,.55)";
    for (const a of mapa.armadilhas) if (camada === "todas" || a.chaves === camada)
      ctx.fillRect(a.coluna * t + t * .2, a.linha * t + t * .2, t * .6, t * .6);
  }
  ctx.lineWidth = Math.max(2, t / 5); ctx.lineCap = "round";
  for (let i = 1; i <= idx && i < perc.length; i++) {
    const a = perc[i - 1], b = perc[i];
    ctx.strokeStyle = CORES_CAMADA[a.chaves.length % CORES_CAMADA.length];
    ctx.beginPath(); ctx.moveTo(a.coluna * t + t / 2, a.linha * t + t / 2); ctx.lineTo(b.coluna * t + t / 2, b.linha * t + t / 2); ctx.stroke();
  }
  if (perc.length) {
    const p = perc[Math.min(idx, perc.length - 1)];
    ctx.fillStyle = "#e8590c"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.coluna * t + t / 2, p.linha * t + t / 2, t * .36, 0, 7); ctx.fill(); ctx.stroke();
  }
  painel();
}

function painel() {
  const p = perc[Math.min(idx, perc.length - 1)];
  $("dPasso").textContent = perc.length ? `${idx} / ${perc.length - 1}` : "–";
  $("dRotulo").textContent = p ? p.estado : "–";
  $("dPos").textContent = p ? `(${p.linha}, ${p.coluna}) '${p.casa}'` : "–";
  $("dChaves").textContent = p ? (p.chaves || "-") : "–";
  $("dBonus").textContent = p ? `{${p.bonus.join(",")}}` : "–";
  $("dCusto").textContent = p ? p.custo_acumulado : "–";
}

function selecionarAlg() {
  parar();
  const r = mapa.algoritmos[$("selAlg").value];
  perc = r.percurso || []; idx = 0;
  $("dStatus").textContent = r.status; $("dStatus").className = "status " + r.status;
  $("dPassos").textContent = r.passos ?? "–"; $("dCustoTot").textContent = r.custo ?? "–";
  $("dMsg").textContent = r.mensagem || "";
  desenhar();
}

async function selecionarMapa() {
  parar();
  mapa = await carregarMapa($("selMapa").value);
  $("selAlg").innerHTML = Object.keys(mapa.algoritmos).map(a => `<option>${a}</option>`).join("");
  $("selCamada").innerHTML = `<option value="todas">todas</option>` + Object.keys(mapa.camadas).map(k => `<option value="${k}">${k}</option>`).join("");
  $("dEstados").textContent = mapa.estados; $("dArcos").textContent = mapa.arcos; $("dTeto").textContent = mapa.teto;
  $("dTrap").textContent = mapa.armadilhas.length;
  selecionarAlg();
}

function passo(d) { idx = Math.max(0, Math.min(perc.length - 1, idx + d)); desenhar(); }
function parar() { clearInterval(timer); timer = null; $("btnPlay").textContent = "▶"; }
function tocar() {
  if (timer) return parar();
  if (idx >= perc.length - 1) idx = 0;
  $("btnPlay").textContent = "⏸";
  const tick = () => { if (idx >= perc.length - 1) return parar(); passo(1); };
  timer = setInterval(tick, 1000 / Number($("vel").value));
}

$("selMapa").onchange = selecionarMapa;
$("selAlg").onchange = selecionarAlg;
$("selCamada").onchange = desenhar;
$("chkTrap").onchange = desenhar;
$("vel").oninput = () => { if (timer) { parar(); tocar(); } };
$("btnPlay").onclick = tocar;
$("btnAvancar").onclick = () => { parar(); passo(1); };
$("btnVoltar").onclick = () => { parar(); passo(-1); };
$("btnInicio").onclick = () => { parar(); idx = 0; desenhar(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") $("btnAvancar").click();
  if (e.key === "ArrowLeft") $("btnVoltar").click();
  if (e.key === " ") { e.preventDefault(); tocar(); }
});

(async () => {
  if (EMBUTIDO) mostrarServidor(null);
  const nomes = await listarMapas();
  $("selMapa").innerHTML = nomes.map(n => `<option>${n}</option>`).join("");
  await selecionarMapa();
})();
</script>
</body>
</html>
